[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ergofluids"
version = "0.1.0"
description = "Koopman/DMD and Mori-Zwanzig modeling of macromolecular transport in viscoelastic tissue (research prototype, pre-validation)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pydmd",
    "pykoopman",
    "pillow",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]
# Used only by scripts/build_plos_docx.py, which also needs the system
# `pandoc` binary (not pip-installable) on PATH.
submission = ["python-docx"]
# Used only by scripts/demo_app.py, a minimal web UI over the predictor and
# active-learning recommender; not needed to use the library or CLI tools.
demo = ["flask"]

[tool.setuptools.packages.find]
where = ["src"]
